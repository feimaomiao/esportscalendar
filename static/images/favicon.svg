<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 102" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Esportscalendar</title>
  <desc id="logo-desc">A calendar block with four cells; the highlighted cell contains a play triangle indicating an upcoming match.</desc>
  <style>
    :root {
      --ink: #0d1117;
      --paper: #f5f5f2;
      --cell: #1a1d24;
      --accent: #00b870;
      --accent-ink: #00150b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #00ff88;
        --accent-ink: #001a0e;
      }
    }
  </style>
  <rect x="1" y="1" width="110" height="100" rx="6" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>
  <rect x="3" y="3" width="106" height="20" fill="var(--paper)"/>
  <circle cx="26" cy="13" r="3.5" fill="var(--ink)"/>
  <circle cx="86" cy="13" r="3.5" fill="var(--ink)"/>
  <rect x="16" y="36" width="36" height="22" rx="2" fill="var(--cell)"/>
  <rect x="60" y="36" width="36" height="22" rx="2" fill="var(--cell)"/>
  <rect x="16" y="66" width="36" height="22" rx="2" fill="var(--cell)"/>
  <rect x="60" y="66" width="36" height="22" rx="2" fill="var(--accent)"/>
  <polygon points="72,71 72,83 84,77" fill="var(--accent-ink)"/>
</svg>
